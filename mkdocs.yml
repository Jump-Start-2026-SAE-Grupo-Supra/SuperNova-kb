site_name: SuperNova KB
site_description: Base de conhecimento da Equipe Supra — Sebrae Supernova 2026
site_url: https://jump-start-2026-sae-grupo-supra.github.io/SuperNova-kb/

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/Jump-Start-2026-SAE-Grupo-Supra/SuperNova-kb
repo_name: SuperNova-kb

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Regulamento:
    - Regras e entregas: regulamento.md
  - Análise de Mercado:
    - Ecossistema brasileiro: analise/ecossistema.md
    - Segmentos e modelos: analise/segmentos.md
    - Investimentos e receita: analise/investimentos.md
  - Estratégia:
    - Ganhadores anteriores: estrategia/ganhadores.md
    - Como somos avaliados: estrategia/avaliacao.md
    - Ideias: estrategia/ideias.md
  - Documentos:
    - Fontes e PDFs: documentos.md
    - Links úteis: links.md
